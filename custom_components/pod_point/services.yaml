charge_now:
  name: Set Pod Point Pod to 'Charge Now'
  description: >-
    Sets a pod to 'Charge Now' for a duration specified. Used to override a schedule temporarily, allowing you to charge for a certain period only. Please allow 5 minutes for mode to change on the pod.

  fields:
    config_entry_id:
      name: Pod Point Account
      description: The account containing the charger. Required for legacy calls without a charger when the account contains exactly one charger.
      required: false
      selector:
        config_entry:
          integration: pod_point
    device_id:
      name: Charger
      description: The charger to boost. May be omitted when the selected account contains exactly one charger.
      required: false
      selector:
        device:
          integration: pod_point
    hours:
      name: Hour(s)
      description: How many hours would you like to enable 'Charge Now' for?
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 24
    minutes:
      name: Minute(s)
      description: How many minutes would you like to enable 'Charge Now' for?
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 59
    seconds:
      name: Seconds(s)
      description: How many seconds would you like to enable 'Charge Now' for?
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 59

stop_charge_now:
  name: Stop Pod Point Pod 'Charge Now'
  description: >-
    Ends a pod's 'Charge Now' mode. Please allow 5 minutes for mode to change on the pod.

  fields:
    config_entry_id:
      name: Pod Point Account
      description: The account containing the charger. Required for legacy calls without a charger when the account contains exactly one charger.
      required: false
      selector:
        config_entry:
          integration: pod_point
    device_id:
      name: Charger
      description: The charger whose boost should stop. May be omitted when the selected account contains exactly one charger.
      required: false
      selector:
        device:
          integration: pod_point
